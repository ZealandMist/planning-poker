<div class="lobby-card" id="lobbyCard">
  <div class="role-tabs" id="roleTabs">
    <button type="button" data-role="host" class="active">Host a session</button>
    <button type="button" data-role="join">Join a session</button>
  </div>

  <label class="field-label" for="nameInput">Your name</label>
  <input id="nameInput" type="text" placeholder="e.g. Priya" maxlength="24" autocomplete="off">

  <div id="joinCodeField">
    <label class="field-label" for="codeInput">Session code</label>
    <input id="codeInput" type="text" placeholder="e.g. TS-A1B2C3" maxlength="20" autocomplete="off">
  </div>

  <button class="btn primary lobby-submit" id="lobbySubmit">Start hosting</button>
  <div class="lobby-error" id="lobbyError"></div>
  <p class="lobby-note" id="lobbyNote">You'll get a session code to share. Anyone with the link or code can join from their own device.</p>
</div>
